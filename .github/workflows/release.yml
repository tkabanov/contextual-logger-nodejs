name: Release

on:
  # Run only after the CI workflow has succeeded on main, never in parallel with it.
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write # npm trusted publishing (OIDC) and provenance
  contents: write # tags, GitHub release, changelog commit
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # semantic-release needs the full history to find the previous release tag.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm
        # Trusted publishing via OIDC requires npm >= 11.5.1; Node 20 ships npm 10.
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        # `prepare` runs the build, so no separate build step is needed.
        run: npm ci

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
